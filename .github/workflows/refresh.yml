name: refresh

# The casks are generated, never hand-edited: every run rebuilds them from the
# live catalogue, so a release anywhere in the fleet reaches the tap without
# anyone touching this repo. A release workflow elsewhere can bring that forward
# by sending a repository_dispatch of type `catalogue-changed`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalogue-changed]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # macOS, because a disk image whose selected asset changed is mounted to
    # read the .app name back out of it rather than guessed from the filename.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_casks.py --verify

      - name: Audit whatever changed
        run: |
          changed=$(git diff --name-only -- Casks | sed 's|Casks/||;s|\.rb$||')
          [ -n "$changed" ] || { echo "nothing changed"; exit 0; }
          tap="$(brew --repository)/Library/Taps/stoatworks-labs/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap"
          rc=0
          for c in $changed; do
            echo "::group::audit $c"
            brew audit --cask --strict "stoatworks-labs/tap/$c" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Commit
        run: |
          git diff --quiet && { echo "no changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks data
          git commit -m "Refresh casks from the catalogue

          Generated by scripts/gen_casks.py from https://stoatworks-labs.com/catalog.json"
          git push
